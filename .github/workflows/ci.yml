name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only values. Real secrets never appear in this file.
  DATABASE_URL: postgresql://voyago:voyago_ci_password@localhost:5432/voyago?schema=public
  MONGODB_URI: mongodb://localhost:27017/voyago_content
  JWT_ACCESS_SECRET: ci_only_access_secret_not_used_anywhere_else_01
  JWT_REFRESH_SECRET: ci_only_refresh_secret_not_used_anywhere_else_02
  CORS_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  API_INTERNAL_URL: http://localhost:4000/api/v1
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SEED_DEMO_CUSTOMER_PASSWORD: CiDemoCustomer!2026
  SEED_DEMO_ADMIN_PASSWORD: CiDemoAdmin!2026
  THROTTLE_LIMIT: '1000'
  AUTH_THROTTLE_LIMIT: '1000'

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json - specifying it
      # here as well makes the action fail with a conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @voyago/shared build

      - name: Generate Prisma client
        run: pnpm --filter @voyago/api exec prisma generate

      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  integration:
    name: API integration tests and production builds
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voyago
          POSTGRES_PASSWORD: voyago_ci_password
          POSTGRES_DB: voyago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voyago" --health-interval 5s
          --health-timeout 5s --health-retries 20

      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json - specifying it
      # here as well makes the action fail with a conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @voyago/shared build

      - name: Generate Prisma client
        run: pnpm --filter @voyago/api exec prisma generate

      - name: Apply migrations from an empty database
        run: pnpm --filter @voyago/api exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm --filter @voyago/api db:seed

      - name: API integration tests
        run: pnpm --filter @voyago/api test:e2e

      - name: Production builds
        run: |
          pnpm --filter @voyago/api build
          pnpm --filter @voyago/web build

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: integration

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voyago
          POSTGRES_PASSWORD: voyago_ci_password
          POSTGRES_DB: voyago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voyago" --health-interval 5s
          --health-timeout 5s --health-retries 20

      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json - specifying it
      # here as well makes the action fail with a conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build everything
        run: |
          pnpm --filter @voyago/shared build
          pnpm --filter @voyago/api exec prisma generate
          pnpm --filter @voyago/api exec prisma migrate deploy
          pnpm --filter @voyago/api db:seed
          pnpm --filter @voyago/api build
          pnpm --filter @voyago/web build

      # Split from the browser download so a failure names which half broke.
      # The runner image already ships most Chromium libraries, so a failure
      # here is a warning: if a library really is missing, the browser install
      # or the tests below fail loudly anyway.
      - name: Install Playwright system dependencies
        continue-on-error: true
        run: |
          pnpm exec playwright install-deps chromium ||
            echo "::warning::playwright install-deps failed; relying on the runner image libraries"

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      # Both servers are started detached with their output captured, so a
      # startup failure shows the actual reason instead of a bare timeout.
      - name: Start the API
        env:
          API_PORT: '4000'
        run: |
          nohup pnpm --filter @voyago/api start > /tmp/voyago-api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --max-time 3 http://localhost:4000/api/v1/health >/dev/null && break
            sleep 2
          done
          if ! curl -sf --max-time 5 http://localhost:4000/api/v1/health/ready; then
            echo "::error::API failed to become ready"
            cat /tmp/voyago-api.log
            exit 1
          fi

      - name: Start the web application
        run: |
          nohup pnpm --filter @voyago/web start > /tmp/voyago-web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --max-time 3 -o /dev/null http://localhost:3000 && break
            sleep 2
          done
          if ! curl -sf --max-time 5 -o /dev/null http://localhost:3000; then
            echo "::error::Web application failed to start"
            cat /tmp/voyago-web.log
            exit 1
          fi

      - name: Run Playwright
        run: pnpm exec playwright test

      - name: Server logs on failure
        if: failure()
        run: |
          echo '--- API ---'; tail -100 /tmp/voyago-api.log || true
          echo '--- WEB ---'; tail -100 /tmp/voyago-web.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
