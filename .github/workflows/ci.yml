name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only values. Real secrets never appear in this file.
  DATABASE_URL: postgresql://voyago:voyago_ci_password@localhost:5432/voyago?schema=public
  MONGODB_URI: mongodb://localhost:27017/voyago_content
  JWT_ACCESS_SECRET: ci_only_access_secret_not_used_anywhere_else_01
  JWT_REFRESH_SECRET: ci_only_refresh_secret_not_used_anywhere_else_02
  CORS_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  API_INTERNAL_URL: http://localhost:4000/api/v1
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SEED_DEMO_CUSTOMER_PASSWORD: CiDemoCustomer!2026
  SEED_DEMO_ADMIN_PASSWORD: CiDemoAdmin!2026
  THROTTLE_LIMIT: '1000'
  AUTH_THROTTLE_LIMIT: '1000'

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @voyago/shared build

      - name: Generate Prisma client
        run: pnpm --filter @voyago/api exec prisma generate

      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  integration:
    name: API integration tests and production builds
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voyago
          POSTGRES_PASSWORD: voyago_ci_password
          POSTGRES_DB: voyago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voyago" --health-interval 5s
          --health-timeout 5s --health-retries 20

      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @voyago/shared build

      - name: Apply migrations from an empty database
        run: pnpm --filter @voyago/api exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm --filter @voyago/api db:seed

      - name: API integration tests
        run: pnpm --filter @voyago/api test:e2e

      - name: Production builds
        run: |
          pnpm --filter @voyago/api build
          pnpm --filter @voyago/web build

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: integration

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voyago
          POSTGRES_PASSWORD: voyago_ci_password
          POSTGRES_DB: voyago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voyago" --health-interval 5s
          --health-timeout 5s --health-retries 20

      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build everything
        run: |
          pnpm --filter @voyago/shared build
          pnpm --filter @voyago/api exec prisma migrate deploy
          pnpm --filter @voyago/api db:seed
          pnpm --filter @voyago/api build
          pnpm --filter @voyago/web build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the API
        run: |
          pnpm --filter @voyago/api start &
          npx wait-on http://localhost:4000/api/v1/health --timeout 90000
        env:
          API_PORT: '4000'

      - name: Start the web application
        run: |
          pnpm --filter @voyago/web start &
          npx wait-on http://localhost:3000 --timeout 90000

      - name: Run Playwright
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
