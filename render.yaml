# Render blueprint for the Voyago API.
#
# Render reads this when you create a Blueprint from the repository. It defines
# the API service only - the frontend is deployed on Vercel, and PostgreSQL and
# MongoDB come from Neon and MongoDB Atlas free tiers.
#
# Values marked sync:false are NOT stored here. Render prompts for them on the
# first deploy and keeps them in its own secret store. Never commit real
# secrets to this file.

services:
  - type: web
    name: voyago-api
    runtime: node
    plan: free
    region: singapore
    branch: main

    # pnpm is enabled through corepack. The shared package has to be built and
    # the Prisma client generated before the API compiles.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @voyago/shared build &&
      pnpm --filter @voyago/api exec prisma generate &&
      pnpm --filter @voyago/api build

    # Migrations run at start, not at build, so they apply to the live database
    # on every deploy. `migrate deploy` only applies committed migrations and
    # never generates new SQL.
    startCommand: >-
      pnpm --filter @voyago/api exec prisma migrate deploy &&
      pnpm --filter @voyago/api start

    healthCheckPath: /api/v1/health/ready

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT and the application binds to it.
      - key: NODE_VERSION
        value: 20.19.0

      # --- Secrets: entered in the Render dashboard, never committed ---
      - key: DATABASE_URL
        sync: false # Neon pooled connection string, with ?sslmode=require
      - key: MONGODB_URI
        sync: false # MongoDB Atlas mongodb+srv:// connection string
      - key: JWT_ACCESS_SECRET
        sync: false # openssl rand -base64 48
      - key: JWT_REFRESH_SECRET
        sync: false # openssl rand -base64 48 - must differ from the access secret
      - key: CORS_ORIGINS
        sync: false # exact Vercel origin, e.g. https://voyago.vercel.app

      # --- Tunable, safe to keep in version control ---
      - key: JWT_ACCESS_TTL
        value: 900s
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: THROTTLE_TTL_SECONDS
        value: 60
      - key: THROTTLE_LIMIT
        value: 120
      # Strict in production. Only local and CI raise this.
      - key: AUTH_THROTTLE_LIMIT
        value: 10
      - key: LOG_LEVEL
        value: info
