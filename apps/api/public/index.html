<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Voyago API</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, sans-serif;
        background: #0a2540;
        color: #d9e2ec;
      }
      main { max-width: 32rem; padding: 2rem; }
      h1 { color: #fff; font-size: 1.5rem; margin: 0 0 0.5rem; }
      code { background: #ffffff1a; padding: 0.15em 0.4em; border-radius: 4px; }
      a { color: #6fccc6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Voyago API</h1>
      <p>
        This host serves the API only. Endpoints live under
        <code>/api/v1</code> — for example
        <a href="/api/v1/health/ready">/api/v1/health/ready</a>.
      </p>
      <p>
        Voyago is a portfolio demonstration. All inventory is seeded demo data
        and all payments and refunds are simulated.
      </p>
    </main>
  </body>
</html>
